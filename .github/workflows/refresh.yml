name: Weekly refresh

# Triggers a fresh Vercel deploy weekly. The deploy itself runs the
# ingestion script (see vercel.json buildCommand), so the manifest is
# always rebuilt from the latest Google Fonts catalogue — no git
# artifacts needed.
#
# Setup:
#   1. In Vercel project settings → Git → Deploy Hooks, create a hook
#      named "Weekly refresh" pointing at the main branch. Copy the URL.
#   2. In GitHub repo → Settings → Secrets and variables → Actions,
#      add a new secret named VERCEL_DEPLOY_HOOK_URL with that URL.
#   3. (For the ingestion to actually re-fetch) in Vercel project →
#      Settings → Environment Variables, add GOOGLE_FONTS_API_KEY
#      with your Web Fonts Developer API key, scoped to Production.

on:
  schedule:
    # Mondays at 03:00 UTC (15:00 NZT)
    - cron: "0 3 * * 1"
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "✗ VERCEL_DEPLOY_HOOK_URL secret not set"
            exit 1
          fi
          curl -sSfX POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "✓ Triggered Vercel deploy"
